name: Test, Build and Deploy
on:
  push:
    branches: [main, "test/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --deny-warnings
      - run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/membership-management-system/"]
    env:
      DEPLOY_BASE: ${{ matrix.base }}
      APP_URL: http://127.0.0.1:4173${{ matrix.base }}
      APP_HASH_ROUTER: ${{ matrix.base == '/' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Test production pages in Chromium
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          python tests/browser/test_app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ strategy.job-index }}
          path: |
            test-results/
            preview.log
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, browser]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
