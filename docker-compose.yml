version: '3.8'

services:
  web:
    build: .
    container_name: membership-system
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    labels:
      - "com.membership.description=会员管理系统"
      - "com.membership.version=1.0.0"
    networks:
      - membership-network

networks:
  membership-network:
    driver: bridge
